packages:
  - packages/*
  - apps/*
  - scripts

engineStrict: true

allowBuilds:
  'esbuild@0.18.20': true
  'esbuild@0.25.12': true
  'esbuild@0.28.2': true

# Shared tool versions, pinned once (D-28). Packages reference them as "catalog:".
catalog:
  "@eslint/js": 10.0.1
  "@types/node": 24.19.2
  eslint: 10.15.0
  fast-check: 4.11.0
  globals: 17.14.0
  tsx: 4.23.15
  turbo: 2.11.13
  typescript: 6.0.3
  typescript-eslint: 8.74.0
  vitest: 5.1.2
  yaml: 2.9.1

overrides:
  "@types/node": "catalog:"

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.1.2'
  - '@vitest/spy@5.1.2'
  - vitest@5.1.2
