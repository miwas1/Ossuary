# Optional: Postgres 18 for machines that have Docker. Nothing in the build needs it (D-35);
# local dev uses PostgreSQL in WSL and tests use PGlite. CI checks that this file parses.
# Usage: cp .env.example .env, set POSTGRES_PASSWORD, then `docker compose up db`.
# Phase 7 adds an `apps` profile: `docker compose --profile apps up` runs both apps against db.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (there is no default)}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ossuary-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  ossuary-pg: {}
