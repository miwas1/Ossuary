name: Thresholds

# Backstop for the guard hook (D-05, D-17): fail when a pull request loosens any
# evals/thresholds.yaml (a min goes down, a max goes up, a key is removed or changes
# direction) unless the PR has the thresholds-change label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  thresholds:
    name: no loosened thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare thresholds.yaml between base and head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THRESHOLDS_CHANGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'thresholds-change') }}
        run: pnpm thresholds:check --base "$BASE_SHA" --head "$HEAD_SHA"
